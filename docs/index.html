<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brighton Fan Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #0057B8;
      --gold: #FFCD00;
      --dark: #07111f;
      --dark2: #0e1f36;
      --card-bg: #111e30;
      --text: #e8edf3;
      --muted: #8fa3bb;
      --border: #1e3150;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 16px;
      min-height: 100vh;
    }

    /* ヘッダー */
    header {
      background: var(--dark2);
      border-bottom: 3px solid var(--gold);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-crest {
      width: 40px;
      height: 40px;
      background: var(--blue);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: var(--gold);
      flex-shrink: 0;
    }

    .header-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 22px;
      color: var(--gold);
      letter-spacing: 0.05em;
      line-height: 1.1;
    }

    .header-sub {
      font-size: 11px;
      color: var(--muted);
      font-weight: 400;
    }

    .header-updated {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
      text-align: right;
      flex-shrink: 0;
    }

    /* デモバナー */
    .demo-banner {
      background: #7a4900;
      border-bottom: 2px solid var(--gold);
      padding: 10px 20px;
      font-size: 13px;
      color: var(--gold);
      text-align: center;
      display: none;
    }

    /* フィルターバー */
    .filter-bar {
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }

    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-btn {
      flex-shrink: 0;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      font-family: 'Noto Sans JP', sans-serif;
      cursor: pointer;
      min-height: 36px;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .filter-btn.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .filter-btn:hover {
      border-color: var(--blue);
      color: var(--text);
    }

    /* ニュースリスト */
    main { padding: 12px 16px 80px; }

    .news-count {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .news-list { display: flex; flex-direction: column; gap: 10px; }

    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      position: relative;
      transition: border-color 0.15s;
    }

    .news-card.is-new {
      border-left: 3px solid var(--gold);
    }

    .news-card:hover { border-color: var(--blue); }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .source-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--blue);
      color: #fff;
      letter-spacing: 0.03em;
    }

    .source-badge.bbc { background: #bb1919; }
    .source-badge.sky { background: #0090d0; }
    .source-badge.guardian { background: #005689; }

    .category-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--border);
      color: var(--muted);
    }

    .new-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--gold);
      color: var(--dark);
      letter-spacing: 0.05em;
    }

    .trust-stars {
      margin-left: auto;
      font-size: 12px;
      color: var(--gold);
    }

    .card-title-ja {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 6px;
    }

    .card-title-ja a {
      color: var(--text);
      text-decoration: none;
    }

    .card-title-ja a:hover {
      color: var(--gold);
      text-decoration: underline;
    }

    .card-summary {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
    }

    .card-date { }

    /* ローディング・エラー */
    .status-msg {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 15px;
    }

    .status-msg .icon { font-size: 40px; margin-bottom: 12px; }

    /* スピナー */
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* フッター */
    footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--dark2);
      border-top: 1px solid var(--border);
      padding: 10px 20px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }

    /* デスクトップ対応 */
    @media (min-width: 640px) {
      main { max-width: 700px; margin: 0 auto; }
      header { padding: 16px 24px; }
      .filter-bar { padding: 12px 24px; }
      main { padding: 16px 24px 80px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-crest">BHA</div>
  <div>
    <div class="header-title">Brighton Fan Intelligence</div>
    <div class="header-sub">イングランドメディア 自動収集</div>
  </div>
  <div class="header-updated" id="updated-time">読み込み中…</div>
</header>

<div class="demo-banner" id="demo-banner">
  ⚠️ デモデータ表示中 — 実データは毎朝6時（JST）に自動更新されます
</div>

<div class="filter-bar" id="filter-bar">
  <button class="filter-btn active" data-cat="all" onclick="filterBy('all')">すべて</button>
</div>

<main>
  <div class="news-count" id="news-count"></div>
  <div class="news-list" id="news-list">
    <div class="status-msg">
      <div class="spinner"></div>
      <div>ニュースを読み込み中…</div>
    </div>
  </div>
</main>

<footer id="footer">Brighton Fan Intelligence — データはGitHub Actionsが毎朝6:00 JSTに更新</footer>

<script>
const CATEGORIES = ['移籍', '試合', '戦術', 'クラブ', '選手', '欧州', '監督', 'コメント', 'W杯'];
const SOURCE_CLASS = { 'BBC Sport': 'bbc', 'The Guardian': 'guardian', 'Sky Sports': 'sky' };

let allArticles = [];
let currentFilter = 'all';

async function loadNews() {
  const sources = ['./data/news.json', './data/demo_news.json'];
  for (const src of sources) {
    try {
      const res = await fetch(src + '?t=' + Date.now());
      if (!res.ok) continue;
      const data = await res.json();
      renderNews(data);
      return;
    } catch (e) {
      continue;
    }
  }
  showError();
}

function renderNews(data) {
  allArticles = data.articles || [];

  // 更新時刻
  const upd = document.getElementById('updated-time');
  upd.textContent = data.updated_at ? '更新: ' + data.updated_at : '';

  // デモバナー
  if (data.is_demo) {
    document.getElementById('demo-banner').style.display = 'block';
  }

  // カテゴリフィルターボタン生成
  const usedCats = [...new Set(allArticles.map(a => a.category).filter(Boolean))];
  const orderedCats = CATEGORIES.filter(c => usedCats.includes(c));
  const bar = document.getElementById('filter-bar');
  orderedCats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.cat = cat;
    btn.textContent = cat;
    btn.onclick = () => filterBy(cat);
    bar.appendChild(btn);
  });

  filterBy('all');
}

function filterBy(cat) {
  currentFilter = cat;

  // ボタン状態更新
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === cat);
  });

  const filtered = cat === 'all' ? allArticles : allArticles.filter(a => a.category === cat);
  const count = document.getElementById('news-count');
  count.textContent = cat === 'all'
    ? `${filtered.length}件`
    : `${cat} · ${filtered.length}件`;

  const list = document.getElementById('news-list');
  if (filtered.length === 0) {
    list.innerHTML = '<div class="status-msg"><div class="icon">📭</div><div>記事がありません</div></div>';
    return;
  }
  list.innerHTML = filtered.map(buildCard).join('');
}

function buildCard(article) {
  const srcClass = SOURCE_CLASS[article.source] || 'guardian';
  const isNew = article.is_new ? '<span class="new-badge">NEW</span>' : '';
  const isNewClass = article.is_new ? ' is-new' : '';
  const cat = article.category ? `<span class="category-badge">${article.category}</span>` : '';
  const trust = article.trust || '';
  const summary = article.summary_ja
    ? `<div class="card-summary">${escHtml(article.summary_ja)}</div>`
    : '';

  return `
    <div class="news-card${isNewClass}">
      <div class="card-meta">
        <span class="source-badge ${srcClass}">${escHtml(article.source)}</span>
        ${cat}
        ${isNew}
        <span class="trust-stars">${trust}</span>
      </div>
      <div class="card-title-ja">
        <a href="${escHtml(article.url)}" target="_blank" rel="noopener">
          ${escHtml(article.title_ja || article.title_en)}
        </a>
      </div>
      ${summary}
      <div class="card-footer">
        <span class="card-date">${escHtml(article.published || '')}</span>
      </div>
    </div>`;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function showError() {
  document.getElementById('news-list').innerHTML =
    '<div class="status-msg"><div class="icon">⚠️</div><div>データを取得できませんでした。<br>しばらくしてからリロードしてください。</div></div>';
  document.getElementById('updated-time').textContent = '';
}

loadNews();
</script>
</body>
</html>
