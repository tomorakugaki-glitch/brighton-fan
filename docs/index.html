<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brighton Fan Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #0057B8;
      --blue-mid: #1a6fd4;
      --gold: #FFCD00;
      --dark: #07111f;
      --dark2: #0e1f36;
      --card-bg: #111e30;
      --text: #e8edf3;
      --muted: #8fa3bb;
      --border: #1e3150;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 16px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ────────────────────────────────────
       HERO
    ──────────────────────────────────── */
    .hero {
      position: relative;
      background:
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(0,87,184,0.35) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 20% 50%, rgba(0,87,184,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 50%, rgba(0,87,184,0.12) 0%, transparent 60%),
        linear-gradient(175deg, #040d19 0%, #081628 45%, #071122 100%);
      padding: 36px 20px 64px;
      overflow: hidden;
      min-height: 270px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Stars */
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 8% 12%, rgba(255,205,0,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 22% 38%, rgba(255,255,255,0.45) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 38% 18%, rgba(255,205,0,0.55) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 8%, rgba(255,255,255,0.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 28%, rgba(255,205,0,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 83% 14%, rgba(255,255,255,0.55) 0%, transparent 100%),
        radial-gradient(1px 1px at 92% 42%, rgba(255,205,0,0.35) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 12% 62%, rgba(255,205,0,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 46% 72%, rgba(255,255,255,0.25) 0%, transparent 100%),
        radial-gradient(1px 1px at 78% 58%, rgba(255,205,0,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 82%, rgba(255,255,255,0.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 62% 88%, rgba(255,205,0,0.25) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 95% 75%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 3% 85%, rgba(255,205,0,0.4) 0%, transparent 100%);
      pointer-events: none;
    }

    /* Searchlight beams */
    .beam {
      position: absolute;
      bottom: 0;
      width: 2px;
      height: 65%;
      transform-origin: bottom center;
      pointer-events: none;
    }

    .beam::after {
      content: '';
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(to top, rgba(255,205,0,0.35), rgba(255,205,0,0.05) 60%, transparent);
    }

    .beam:nth-child(1) { left: 12%; animation: sweep-a 7s ease-in-out infinite; }
    .beam:nth-child(2) { left: 26%; animation: sweep-b 8s ease-in-out infinite; animation-delay: -2s; }
    .beam:nth-child(3) { right: 26%; animation: sweep-a 9s ease-in-out infinite; animation-delay: -4s; }
    .beam:nth-child(4) { right: 12%; animation: sweep-b 7.5s ease-in-out infinite; animation-delay: -1s; }

    @keyframes sweep-a {
      0%, 100% { transform: rotate(-18deg); opacity: 0.7; }
      50% { transform: rotate(12deg); opacity: 0.3; }
    }
    @keyframes sweep-b {
      0%, 100% { transform: rotate(14deg); opacity: 0.4; }
      50% { transform: rotate(-16deg); opacity: 0.8; }
    }

    /* Horizontal pitch-line glow */
    .hero-glow-line {
      position: absolute;
      bottom: 48px;
      left: 5%; right: 5%;
      height: 1px;
      background: linear-gradient(
        to right,
        transparent,
        rgba(255,205,0,0.2) 20%,
        rgba(0,87,184,0.6) 50%,
        rgba(255,205,0,0.2) 80%,
        transparent
      );
      pointer-events: none;
    }

    /* BHA Crest */
    .hero-crest-wrap {
      position: relative;
      z-index: 2;
      margin-bottom: 14px;
    }

    .hero-crest-glow {
      position: absolute;
      inset: -16px;
      background: radial-gradient(ellipse at center, rgba(255,205,0,0.22), transparent 70%);
      animation: crest-breathe 3.5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes crest-breathe {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    .crest-shield {
      width: 76px;
      height: 86px;
      position: relative;
      background: linear-gradient(150deg, #0068d8 0%, #003f90 55%, #002a65 100%);
      clip-path: polygon(50% 100%, 0% 72%, 0% 0%, 100% 0%, 100% 72%);
      border: 2.5px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 24px rgba(255,205,0,0.25), inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .crest-shield::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to right,
        transparent 0,
        transparent 12px,
        rgba(255,255,255,0.06) 12px,
        rgba(255,255,255,0.06) 14px
      );
    }

    .crest-shield::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 40%;
      background: linear-gradient(to bottom, rgba(255,255,255,0.08), transparent);
    }

    .crest-bha {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 24px;
      color: var(--gold);
      letter-spacing: 0.04em;
      position: relative;
      z-index: 1;
      text-shadow: 0 1px 6px rgba(0,0,0,0.6);
    }

    .crest-year {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: 9px;
      color: rgba(255,205,0,0.6);
      position: relative;
      z-index: 1;
      letter-spacing: 0.15em;
      margin-top: 1px;
    }

    /* Hero text */
    .hero-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 34px;
      color: var(--gold);
      letter-spacing: 0.07em;
      text-align: center;
      position: relative;
      z-index: 2;
      text-transform: uppercase;
      text-shadow: 0 0 40px rgba(255,205,0,0.35), 0 2px 8px rgba(0,0,0,0.5);
      line-height: 1;
    }

    .hero-subtitle {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      position: relative;
      z-index: 2;
      margin-top: 7px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .hero-updated {
      position: absolute;
      top: 14px;
      right: 16px;
      font-size: 11px;
      color: rgba(143,163,187,0.65);
      z-index: 2;
      text-align: right;
      line-height: 1.4;
    }

    /* Wave bottom */
    .hero-wave {
      position: absolute;
      bottom: -1px;
      left: 0; right: 0;
      height: 44px;
      z-index: 3;
      pointer-events: none;
    }
    .hero-wave path { fill: var(--dark); }

    /* ────────────────────────────────────
       DEMO BANNER
    ──────────────────────────────────── */
    .demo-banner {
      background: rgba(100,58,0,0.9);
      border-bottom: 2px solid var(--gold);
      padding: 10px 20px;
      font-size: 13px;
      color: var(--gold);
      text-align: center;
      display: none;
    }

    /* ────────────────────────────────────
       FILTER BAR
    ──────────────────────────────────── */
    .filter-bar-wrap {
      position: sticky;
      top: 0;
      background: var(--dark);
      z-index: 50;
      border-bottom: 1px solid var(--border);
    }

    .filter-bar {
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-btn {
      flex-shrink: 0;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 20px;
      padding: 9px 16px;
      font-size: 13px;
      font-family: 'Noto Sans JP', sans-serif;
      cursor: pointer;
      min-height: 44px;
      transition: background 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s;
      white-space: nowrap;
    }

    .filter-btn.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
      box-shadow: 0 0 14px rgba(0,87,184,0.45);
    }

    .filter-btn:hover:not(.active) {
      border-color: var(--blue-mid);
      color: var(--text);
    }

    /* ────────────────────────────────────
       MAIN
    ──────────────────────────────────── */
    main { padding: 16px 16px 84px; }

    .news-count {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: opacity 0.18s ease;
    }

    /* ────────────────────────────────────
       NEWS CARDS
    ──────────────────────────────────── */
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: row;
      position: relative;
      transition: border-color 0.2s, box-shadow 0.2s;
      opacity: 0;
      transform: translateY(14px);
      animation: card-in 0.38s ease forwards;
    }

    @keyframes card-in {
      to { opacity: 1; transform: translateY(0); }
    }

    .news-card.is-new::before {
      content: '';
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 3px;
      background: var(--gold);
      box-shadow: 2px 0 10px rgba(255,205,0,0.35);
    }

    .news-card:hover {
      border-color: rgba(0,87,184,0.7);
      box-shadow: 0 4px 24px rgba(0,87,184,0.2), 0 0 0 1px rgba(0,87,184,0.12);
    }

    .news-card.is-new:hover {
      border-color: rgba(255,205,0,0.5);
      box-shadow: 0 4px 24px rgba(255,205,0,0.12), 0 0 0 1px rgba(255,205,0,0.08);
    }

    /* ── Image pane ── */
    .card-img-wrap {
      width: 200px;
      min-width: 200px;
      height: 150px;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
      background: var(--dark2);
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .news-card:hover .card-img-wrap img {
      transform: scale(1.06);
    }

    /* CSS placeholder */
    .card-img-ph {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .card-img-ph.guardian {
      background: linear-gradient(135deg, #00314c 0%, #005689 55%, #003c60 100%);
    }
    .card-img-ph.bbc {
      background: linear-gradient(135deg, #6e0808 0%, #bb1919 55%, #800a0a 100%);
    }
    .card-img-ph.sky {
      background: linear-gradient(135deg, #004e6e 0%, #0090d0 55%, #005c82 100%);
    }
    .card-img-ph.default {
      background: linear-gradient(135deg, var(--dark2) 0%, #0a3060 55%, var(--dark2) 100%);
    }

    .card-img-ph::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 12px,
        rgba(255,255,255,0.025) 12px,
        rgba(255,255,255,0.025) 24px
      );
    }

    .ph-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 26px;
      color: rgba(255,255,255,0.18);
      letter-spacing: 0.05em;
      position: relative;
      z-index: 1;
    }

    /* ── Card body ── */
    .card-body {
      padding: 12px 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .source-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      color: #fff;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }

    .source-badge.guardian { background: #005689; }
    .source-badge.bbc      { background: #bb1919; }
    .source-badge.sky      { background: #0090d0; }

    .cat-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--border);
      color: var(--muted);
      flex-shrink: 0;
    }

    .new-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--gold);
      color: var(--dark);
      letter-spacing: 0.06em;
      flex-shrink: 0;
    }

    .trust {
      margin-left: auto;
      font-size: 11px;
      color: var(--gold);
      flex-shrink: 0;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.48;
      margin-bottom: 6px;
    }

    .card-title a {
      color: var(--text);
      text-decoration: none;
      transition: color 0.15s;
    }

    .card-title a:hover { color: var(--gold); }

    .card-summary {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .card-footer {
      font-size: 11px;
      color: var(--muted);
      margin-top: auto;
    }

    /* ────────────────────────────────────
       STATUS
    ──────────────────────────────────── */
    .status-msg {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 15px;
    }

    .status-msg .icon { font-size: 40px; margin-bottom: 12px; }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ────────────────────────────────────
       FOOTER
    ──────────────────────────────────── */
    footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(10,22,40,0.96);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      padding: 10px 20px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      z-index: 100;
    }

    /* ────────────────────────────────────
       RESPONSIVE
    ──────────────────────────────────── */
    @media (max-width: 599px) {
      .hero { padding: 28px 16px 52px; min-height: 210px; }
      .hero-title { font-size: 26px; }
      .crest-shield { width: 60px; height: 68px; }
      .crest-bha { font-size: 19px; }

      .news-card { flex-direction: column; }
      .card-img-wrap {
        width: 100%;
        min-width: unset;
        height: 170px;
      }
      .card-body { padding: 12px; }
    }

    @media (min-width: 600px) {
      .filter-bar { padding: 10px 24px; }
    }

    @media (min-width: 640px) {
      main {
        max-width: 800px;
        margin: 0 auto;
        padding: 16px 24px 84px;
      }
      .filter-bar {
        max-width: 800px;
        margin: 0 auto;
      }
      .hero-title { font-size: 42px; }
    }
  </style>
</head>
<body>

<!-- HERO -->
<header class="hero">
  <div class="beam"></div>
  <div class="beam"></div>
  <div class="beam"></div>
  <div class="beam"></div>
  <div class="hero-glow-line"></div>

  <div class="hero-updated" id="updated-time">読み込み中…</div>

  <div class="hero-crest-wrap">
    <div class="hero-crest-glow"></div>
    <div class="crest-shield">
      <div class="crest-bha">BHA</div>
      <div class="crest-year">1901</div>
    </div>
  </div>

  <div class="hero-title">Brighton Fan Intelligence</div>
  <div class="hero-subtitle">イングランドメディア 自動収集 &middot; 日本語翻訳</div>

  <svg class="hero-wave" viewBox="0 0 1440 44" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,22 C240,44 480,0 720,22 C960,44 1200,4 1440,22 L1440,44 L0,44 Z"/>
  </svg>
</header>

<div class="demo-banner" id="demo-banner">
  ⚠️ デモデータ表示中 — 実データは毎朝6時（JST）に自動更新されます
</div>

<div class="filter-bar-wrap">
  <div class="filter-bar" id="filter-bar">
    <button class="filter-btn active" data-cat="all" onclick="filterBy('all')">すべて</button>
  </div>
</div>

<main>
  <div class="news-count" id="news-count"></div>
  <div class="news-list" id="news-list">
    <div class="status-msg">
      <div class="spinner"></div>
      <div>ニュースを読み込み中…</div>
    </div>
  </div>
</main>

<footer>Brighton Fan Intelligence — データはGitHub Actionsが毎朝6:00 JSTに更新</footer>

<script>
const CATS = ['移籍','試合','戦術','クラブ','選手','欧州','監督','コメント','W杯'];
const SRC_CLS = { 'BBC Sport': 'bbc', 'The Guardian': 'guardian', 'Sky Sports': 'sky' };
const PH_LABEL = { 'bbc': 'BBC', 'sky': 'SKY', 'guardian': 'BHA', '': 'BHA' };

let allArticles = [];

async function loadNews() {
  for (const src of ['./data/news.json', './data/demo_news.json']) {
    try {
      const res = await fetch(src + '?t=' + Date.now());
      if (!res.ok) continue;
      const data = await res.json();
      if (!data.articles || data.articles.length === 0) continue;
      renderNews(data);
      return;
    } catch (_) { continue; }
  }
  showError();
}

function renderNews(data) {
  allArticles = data.articles || [];

  const upd = document.getElementById('updated-time');
  upd.textContent = data.updated_at ? '更新: ' + data.updated_at : '';

  if (data.is_demo) {
    document.getElementById('demo-banner').style.display = 'block';
  }

  const usedCats = new Set(allArticles.map(a => a.category).filter(Boolean));
  const bar = document.getElementById('filter-bar');
  CATS.filter(c => usedCats.has(c)).forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.cat = cat;
    btn.textContent = cat;
    btn.onclick = () => filterBy(cat);
    bar.appendChild(btn);
  });

  filterBy('all');
}

function filterBy(cat) {
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === cat);
  });

  const filtered = cat === 'all' ? allArticles : allArticles.filter(a => a.category === cat);
  const countEl = document.getElementById('news-count');
  countEl.textContent = cat === 'all' ? `${filtered.length}件` : `${cat} · ${filtered.length}件`;

  const list = document.getElementById('news-list');
  list.style.opacity = '0';

  setTimeout(() => {
    if (filtered.length === 0) {
      list.innerHTML = '<div class="status-msg"><div class="icon">📭</div><div>記事がありません</div></div>';
    } else {
      list.innerHTML = filtered.map((a, i) => buildCard(a, i)).join('');
    }
    list.style.opacity = '1';
  }, 130);
}

function buildCard(a, idx) {
  const srcCls = SRC_CLS[a.source] || 'guardian';
  const isNewCls = a.is_new ? ' is-new' : '';
  const newBadge = a.is_new ? '<span class="new-badge">NEW</span>' : '';
  const catBadge = a.category ? `<span class="cat-badge">${esc(a.category)}</span>` : '';
  const trust = a.trust ? `<span class="trust">${esc(a.trust)}</span>` : '';
  const summary = a.summary_ja
    ? `<div class="card-summary">${esc(a.summary_ja)}</div>` : '';

  const delay = Math.min(idx * 0.05, 0.5);
  const style = `animation-delay:${delay}s`;

  let imgHtml;
  if (a.image_url) {
    imgHtml = `<div class="card-img-wrap">
      <img src="${esc(a.image_url)}" alt="" loading="lazy"
           onerror="this.outerHTML='<div class=\\"card-img-ph ${srcCls}\\"><span class=\\"ph-label\\">${PH_LABEL[srcCls]||'BHA'}</span></div>'">
    </div>`;
  } else {
    imgHtml = `<div class="card-img-wrap">
      <div class="card-img-ph ${srcCls}">
        <span class="ph-label">${PH_LABEL[srcCls] || 'BHA'}</span>
      </div>
    </div>`;
  }

  return `<div class="news-card${isNewCls}" style="${style}">
    ${imgHtml}
    <div class="card-body">
      <div class="card-meta">
        <span class="source-badge ${srcCls}">${esc(a.source)}</span>
        ${catBadge}${newBadge}${trust}
      </div>
      <div class="card-title">
        <a href="${esc(a.url)}" target="_blank" rel="noopener">
          ${esc(a.title_ja || a.title_en || '')}
        </a>
      </div>
      ${summary}
      <div class="card-footer">${esc(a.published || '')}</div>
    </div>
  </div>`;
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showError() {
  document.getElementById('news-list').innerHTML =
    '<div class="status-msg"><div class="icon">⚠️</div><div>データを取得できませんでした。<br>しばらくしてからリロードしてください。</div></div>';
  document.getElementById('updated-time').textContent = '';
}

loadNews();
</script>
</body>
</html>
